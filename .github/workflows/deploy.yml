name: Test & Build Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Деплой на домашний сервер выполняется вручную: Scripts/update.sh (см. README → «Обновление на сервере»)

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}

jobs:
  # --- 1. ЭТАП ТЕСТИРОВАНИЯ ---
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-22.04
    services:
      # Поднимаем "одноразовую" базу данных для тестов
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kudos_test
        ports:
          - 5432:5432
        # Ждем, пока база будет готова принимать подключения
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: "5.9"

    - name: Run Tests
      # Важно: указываем localhost:5432, так как внутри GitHub Runner база доступна локально
      run: swift test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kudos_test?sslmode=disable

  # --- 2. ЭТАП СБОРКИ (Запускается только если тесты прошли) ---
  build-and-push:
    needs: test # <--- ВАЖНО: Ждем успеха тестов
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Telegram (image ready)
        if: success()
        run: |
          REPO="${GITHUB_REPOSITORY}"
          SHA_SHORT="${GITHUB_SHA::7}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"

          TEXT="<b>📦 Новый образ готов</b>%0A\
          Commit: <code>${SHA_SHORT}</code>%0A\
          Обнови на сервере: <code>./Scripts/update.sh</code>%0A\
          <a href=\"${RUN_URL}\">Open workflow run</a>"

          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${TEXT}" \
            -d "parse_mode=HTML" > /dev/null

      - name: Notify Telegram (failure)
        if: failure()
        run: |
          REPO="${GITHUB_REPOSITORY}"
          SHA_SHORT="${GITHUB_SHA::7}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"

          TEXT="<b>❌ Сборка образа упала</b>%0A\
          Commit: <code>${SHA_SHORT}</code>%0A\
          <a href=\"${RUN_URL}\">Open workflow run</a>"

          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${TEXT}" \
            -d "parse_mode=HTML" > /dev/null
